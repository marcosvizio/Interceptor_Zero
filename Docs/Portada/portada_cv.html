<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Interceptor Zero – Portada CV</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#111;overflow:hidden}
svg{display:block}
.title{font-family:'Black Ops One',sans-serif}
.sub{font-family:'Barlow Condensed',sans-serif;font-weight:700}
</style></head><body>
<!-- 1920x1080 (16:9) para CV / portfolio / banner -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M60 0H0V60" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="2"/>
  </pattern>
  <pattern id="hazard" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="56" height="56" fill="#16140c"/><rect width="28" height="56" fill="#d9a400"/>
  </pattern>
  <pattern id="treads" width="20" height="16" patternUnits="userSpaceOnUse">
    <rect width="20" height="16" fill="#1d1f19"/><rect width="20" height="5" fill="#3a3d32"/>
  </pattern>
  <radialGradient id="grass" cx="72%" cy="62%" r="75%">
    <stop offset="0" stop-color="#3a4d2c"/><stop offset=".55" stop-color="#25331d"/><stop offset="1" stop-color="#0e130b"/>
  </radialGradient>
  <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b1d21"/><stop offset=".5" stop-color="#26292e"/><stop offset="1" stop-color="#191b1f"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="55%" r="75%">
    <stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/>
  </radialGradient>
  <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05070a" stop-opacity=".85"/><stop offset="1" stop-color="#05070a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#05070a" stop-opacity=".9"/><stop offset=".38" stop-color="#05070a" stop-opacity=".7"/><stop offset=".6" stop-color="#05070a" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="boom">
    <stop offset="0" stop-color="#fffbe0"/><stop offset=".22" stop-color="#ffd84a"/>
    <stop offset=".5" stop-color="#ff7d1a" stop-opacity=".9"/><stop offset="1" stop-color="#ff3d00" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowY">
    <stop offset="0" stop-color="#ffc400" stop-opacity=".5"/><stop offset="1" stop-color="#ffc400" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="smoke">
    <stop offset="0" stop-color="#2a2a2a" stop-opacity=".85"/><stop offset="1" stop-color="#2a2a2a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="trail" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#ff8a1a" stop-opacity="0"/><stop offset=".65" stop-color="#ffaa30" stop-opacity=".75"/><stop offset="1" stop-color="#fff3b8"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="12" dy="16" stdDeviation="7" flood-color="#000" flood-opacity=".6"/>
  </filter>
  <filter id="textShadow" x="-10%" y="-30%" width="120%" height="160%">
    <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".85"/>
  </filter>

  <!-- Tanque del jugador: centrado en la torreta, mirando hacia -Y -->
  <g id="tank">
    <rect x="-104" y="-124" width="48" height="248" rx="8" fill="url(#treads)" stroke="#0e0f0b" stroke-width="5"/>
    <rect x="56" y="-124" width="48" height="248" rx="8" fill="url(#treads)" stroke="#0e0f0b" stroke-width="5"/>
    <rect x="-66" y="-110" width="132" height="218" rx="10" fill="#4b5d2c" stroke="#1a2010" stroke-width="5"/>
    <rect x="-52" y="46" width="104" height="48" rx="4" fill="#3a4822"/>
    <rect x="-52" y="-98" width="104" height="18" rx="3" fill="#57693a"/>
    <rect x="-10" y="-234" width="20" height="200" rx="3" fill="#34411f" stroke="#141a0b" stroke-width="4"/>
    <rect x="-15" y="-248" width="30" height="30" rx="4" fill="#2a3419" stroke="#141a0b" stroke-width="4"/>
    <circle r="56" fill="#5b6e3d" stroke="#1a2010" stroke-width="6"/>
    <circle cx="-15" cy="15" r="17" fill="#3d4b27" stroke="#1a2010" stroke-width="3"/>
    <rect x="16" y="-32" width="22" height="10" rx="2" fill="#3d4b27"/>
  </g>

  <!-- Charger (enemigo blindado): mirando hacia -Y -->
  <g id="charger">
    <g fill="#141414" stroke="#000" stroke-width="3">
      <rect x="-76" y="-88" width="22" height="36" rx="6"/><rect x="-76" y="-40" width="22" height="36" rx="6"/>
      <rect x="-76" y="8" width="22" height="36" rx="6"/><rect x="-76" y="56" width="22" height="36" rx="6"/>
      <rect x="54" y="-88" width="22" height="36" rx="6"/><rect x="54" y="-40" width="22" height="36" rx="6"/>
      <rect x="54" y="8" width="22" height="36" rx="6"/><rect x="54" y="56" width="22" height="36" rx="6"/>
    </g>
    <path d="M-58 -80 L-38 -114 L38 -114 L58 -80 L58 102 L-58 102 Z" fill="#7a3324" stroke="#2b0f0a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-38 -114 L38 -114 L48 -96 L-48 -96 Z" fill="#3f170f"/>
    <rect x="-42" y="-74" width="84" height="124" rx="6" fill="#8d3e2b"/>
    <rect x="-32" y="62" width="64" height="30" rx="3" fill="#5e2619"/>
    <rect x="-5" y="-88" width="10" height="60" fill="#2b0f0a"/>
    <circle cy="-20" r="25" fill="#5e2619" stroke="#2b0f0a" stroke-width="4"/>
    <rect x="-46" y="-110" width="14" height="8" fill="#ffd36b"/><rect x="32" y="-110" width="14" height="8" fill="#ffd36b"/>
  </g>

  <!-- Barra de vida world-space (billboard: no rota con el enemigo) -->
  <g id="hpbar">
    <rect x="-62" y="-10" width="124" height="20" rx="4" fill="#000" fill-opacity=".75"/>
    <rect x="-57" y="-5" width="114" height="10" rx="2" fill="#3a1410"/>
    <rect x="-57" y="-5" width="80" height="10" rx="2" fill="#e5392b"/>
  </g>

  <g id="gen">
    <rect x="-62" y="-62" width="124" height="124" rx="6" fill="#3d4430" stroke="#0d0f0a" stroke-width="6"/>
    <rect x="-48" y="-48" width="96" height="96" rx="3" fill="#4b533b"/>
    <path d="M9 -40 L-24 6 L-3 6 L-11 42 L24 -6 L3 -6 Z" fill="#f2b705"/>
  </g>
  <g id="genDead">
    <rect x="-62" y="-62" width="124" height="124" rx="6" fill="#151515" stroke="#050505" stroke-width="6"/>
    <rect x="-48" y="-48" width="96" height="96" rx="3" fill="#1d1d1b"/>
    <path d="M9 -40 L-24 6 L-3 6 L-11 42 L24 -6 L3 -6 Z" fill="#3b3420"/>
  </g>

  <g id="tree">
    <circle r="50" fill="#16230f"/><circle cx="-14" cy="-12" r="32" fill="#22361a"/>
    <circle cx="17" cy="9" r="28" fill="#1d2f16"/><circle cx="-6" cy="-20" r="13" fill="#2d4523"/>
  </g>

  <!-- Misil: punta en el origen mirando hacia -Y, estela hacia +Y -->
  <g id="missile">
    <rect x="-12" y="0" width="24" height="170" rx="12" fill="url(#trail)" filter="url(#blur)"/>
    <rect x="-6" y="4" width="12" height="150" rx="6" fill="url(#trail)"/>
    <path d="M0 -26 L9 -12 L9 18 L-9 18 L-9 -12 Z" fill="#d8d1b5" stroke="#3a3628" stroke-width="2"/>
    <path d="M-9 10 L-16 22 L-9 18 Z M9 10 L16 22 L9 18 Z" fill="#8a8470"/>
  </g>

  <g id="muzzle">
    <circle r="46" fill="url(#boom)" opacity=".9"/>
    <path d="M0 -60 L10 -14 L34 -30 L14 -4 L0 6 L-14 -4 L-34 -30 L-10 -14 Z" fill="#fff0a8"/>
  </g>

  <g id="explosion">
    <circle r="200" fill="url(#glowY)"/>
    <circle cx="40" cy="-30" r="80" fill="url(#smoke)"/>
    <circle cx="-50" cy="-60" r="70" fill="url(#smoke)"/>
    <circle r="135" fill="url(#boom)"/>
    <path d="M0 -120 L22 -40 L95 -80 L44 -12 L120 18 L38 30 L60 104 L4 46 L-46 112 L-30 34 L-112 30 L-40 -10 L-92 -74 L-20 -40 Z" fill="#ffd23a" opacity=".85"/>
    <path d="M0 -70 L14 -24 L56 -44 L26 -6 L70 12 L22 18 L34 60 L2 26 L-26 64 L-18 20 L-64 16 L-24 -6 L-52 -42 L-12 -24 Z" fill="#fffbe0"/>
    <g fill="#1a1a1a">
      <rect x="128" y="-60" width="16" height="10" transform="rotate(30 128 -60)"/>
      <rect x="-150" y="40" width="14" height="9" transform="rotate(-20 -150 40)"/>
      <rect x="70" y="120" width="12" height="8" transform="rotate(50 70 120)"/>
      <rect x="-90" y="-140" width="12" height="8" transform="rotate(15 -90 -140)"/>
    </g>
  </g>
</defs>

<!-- Suelo -->
<rect width="1920" height="1080" fill="url(#grass)"/>
<rect width="1920" height="1080" fill="url(#grid)"/>

<!-- Ruta -->
<rect x="0" y="232" width="1920" height="118" fill="url(#asphalt)"/>
<line x1="0" y1="232" x2="1920" y2="232" stroke="#4a4d52" stroke-width="3"/>
<line x1="0" y1="350" x2="1920" y2="350" stroke="#4a4d52" stroke-width="3"/>
<line x1="0" y1="291" x2="1920" y2="291" stroke="#b58a12" stroke-opacity=".7" stroke-width="7" stroke-dasharray="46 40"/>

<!-- Árboles -->
<g filter="url(#shadow)">
  <use href="#tree" transform="translate(1840 590) scale(1.1)"/>
  <use href="#tree" transform="translate(1420 985) scale(.9)"/>
  <use href="#tree" transform="translate(1000 640) scale(.85)"/>
  <use href="#tree" transform="translate(1560 470) scale(.75)"/>
</g>

<!-- Generadores: uno destruido, uno explotando, uno vivo -->
<g filter="url(#shadow)">
  <use href="#genDead" transform="translate(1030 920)"/>
  <use href="#genDead" transform="translate(1180 440) rotate(8)"/>
  <use href="#gen" transform="translate(1810 890)"/>
</g>
<circle cx="1810" cy="890" r="130" fill="url(#glowY)"/>
<use href="#explosion" transform="translate(1180 440)"/>

<!-- Chargers persiguiendo al tanque -->
<g filter="url(#shadow)">
  <use href="#charger" transform="translate(1780 291) rotate(-153) scale(.85)"/>
  <use href="#charger" transform="translate(1230 905) rotate(68) scale(.85)"/>
</g>
<use href="#hpbar" transform="translate(1780 160)"/>
<use href="#hpbar" transform="translate(1230 790)"/>

<!-- Tanque del jugador disparando -->
<g filter="url(#shadow)">
  <use href="#tank" transform="translate(1560 780) rotate(-45)"/>
</g>
<use href="#muzzle" transform="translate(1386 606) rotate(-45)"/>
<use href="#missile" transform="translate(1290 510) rotate(-45)"/>

<!-- Viñeta y sombra a la izquierda para que el texto se lea -->
<rect width="1920" height="1080" fill="url(#vignette)"/>
<rect width="1920" height="1080" fill="url(#leftShade)"/>

<!-- Texto -->
<g filter="url(#textShadow)">
  <text x="112" y="420" class="sub" font-size="34" fill="#f2b705" letter-spacing="9">TOP-DOWN TANK SHOOTER · UNITY</text>
  <text x="104" y="545" class="title" font-size="116" fill="#ece6cf" letter-spacing="3">INTERCEPTOR</text>
  <text x="104" y="715" class="title" font-size="176" fill="#f2b705" letter-spacing="26">ZERO</text>
</g>
<rect x="112" y="752" width="420" height="14" fill="url(#hazard)"/>
<g class="sub" filter="url(#textShadow)">
  <text x="112" y="826" font-size="38" fill="#ece6cf" letter-spacing="1">Destruí los generadores. Abrí la salida. Escapá.</text>
  <text x="112" y="880" font-size="29" fill="#b9b39a" letter-spacing="3">UNITY 6 · C# · URP · NAVMESH · OBJECT POOLING · WEBGL</text>
  <text x="112" y="935" font-size="29" fill="#8f8a76" letter-spacing="2">Marcos Vizio · marcosvizio.itch.io/interceptor-zero</text>
</g>

<!-- Franjas de peligro (como en el menú) -->
<rect x="0" y="0" width="1920" height="30" fill="url(#hazard)"/>
<rect x="0" y="1050" width="1920" height="30" fill="url(#hazard)"/>
</svg>
</body></html>
